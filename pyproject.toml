[project]
name = "thermomix-cli"
version = "0.3.0"
description = "An unofficial command-line tool for Cookidoo – recipes, collections, the week planner and the shopping list."
requires-python = ">=3.12"
dependencies = [
    # 0.18.3 is the version every call here was checked against, and the one
    # that exposes list_custom_recipes. See requirements.lock for the full set.
    "cookidoo-api>=0.18.3",
    "typer>=0.25",
    "rich>=14",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
thermomix-cli = "thermomix_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thermomix_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
